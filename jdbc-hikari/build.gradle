plugins {
    id 'io.micronaut.build.internal.sql-module'
}

dependencies {
    api projects.micronautJdbc
    api(mn.micronaut.inject)
    api(libs.managed.hikaricp)

    // HikariHealthIndicator: Mono/Flux appear in its public API (Publisher<HealthResult>)
    implementation(mn.reactor)

    compileOnly(mnMicrometer.micronaut.micrometer.core)
    // HealthIndicator, HealthEndpoint, HealthResult, HealthAggregator, TaskExecutors — optional feature
    compileOnly(mn.micronaut.management)

    testRuntimeOnly(libs.managed.h2)

    testAnnotationProcessor(mn.micronaut.inject.java)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mn.micronaut.management)

    testImplementation(mnMicrometer.micronaut.micrometer.core)
    testImplementation(mnCache.micronaut.cache.core)
}
